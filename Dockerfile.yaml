# Gunakan image Nginx + PHP 7.4 FPM yang sudah dikonfigurasi untuk web
FROM richarvey/nginx-php-fpm:php7.4

# Set working directory
WORKDIR /var/www/html

# Install ekstensi PostgreSQL (Wajib untuk Supabase)
RUN docker-php-ext-install pdo_pgsql pgsql

# Copy semua file project ke dalam container
COPY . .

# Arahkan web server ke folder public Laravel
ENV WEBROOT /var/www/html/public

# Install Composer
COPY --from=composer:latest /usr/bin/composer /usr/bin/composer

# Install dependensi Laravel tanpa package development (lebih ringan)
RUN composer install --no-dev --optimize-autoloader

# Beri izin akses agar Laravel bisa menulis cache dan log
RUN chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
COPY nginx-site.conf /etc/nginx/conf.d/default.conf